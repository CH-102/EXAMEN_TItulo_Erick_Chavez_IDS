<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Libros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Mi Catálogo de Libros</h1>
    </header>

    <main class="catalogo">
        <!-- Libro 1 -->
        <article class="tarjeta-libro">
            <img src="https://via.placeholder.com/150x220" alt="Portada de Don Quijote">
            <h2>Don Quijote de la Mancha</h2>
            <p class="autor">Miguel de Cervantes</p>
            <p class="precio">$250.00 MXN</p>
        </article>

        <!-- Libro 2 -->
        <article class="tarjeta-libro">
            <img src="https://via.placeholder.com/150x220" alt="Portada de Cien años de soledad">
            <h2>Cien Años de Soledad</h2>
            <p class="autor">Gabriel García Márquez</p>
            <p class="precio">$300.00 MXN</p>
        </article>

        <!-- Libro 3 -->
        <article class="tarjeta-libro">
            <img src="https://via.placeholder.com/150x220" alt="Portada de El Principito">
            <h2>El Principito</h2>
            <p class="autor">Antoine de Saint-Exupéry</p>
            <p class="precio">$180.00 MXN</p>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 Catálogo de Libros - Proyecto Web</p>
    </footer>

</body>
</html>
